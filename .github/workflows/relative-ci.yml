name: Relative CI

on:
  workflow_dispatch:
  push:
    branches:
      - "*.*.*"
      - "main"
      - "master"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  bundle_analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: NODE_OPTIONS="--openssl-legacy-provider" npm run build -- --stats

      - name: Send to RelativeCI
        uses: relative-ci/agent-action@v3
        with:
          webpackStatsFile: ./dist/bundle-stats.json
          key: ${{ secrets.RELATIVE_CI_KEY }}
