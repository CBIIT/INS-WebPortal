- page: '/about'
  title: "About the Index of NCI Studies (INS)"
  content:
    - paragraph: "Key Takeaways"
    - paragraph: "The National Cancer Institute (NCI) Index of NCI Studies (INS) compiles and shares information about research outputs produced by NCI-supported programs."
    - paragraph: "The INS is continuing to evolve and is not yet comprehensive. Additional programs and output types will be added periodically."
    - paragraph: "The INS incorporates information from NIH RePORTER, NIH iCite, NCBI Entrez databases (including PubMed, dbGaP, GEO, and SRA), and a range of NCI-supported data resources."
    - paragraph: "INS OBJECTIVES AND SCOPE"
    - paragraph: "The National Cancer Institute (NCI) is pleased to release the next phase of the Index of NCI Studies (INS) to tackle the challenge of assembling NCI program information from publicly available resources. Building connections between NCI programs, projects, grants, and research outputs is a complex task typically addressed through manual curation by portfolio analysis experts. Due to the challenging nature of curating this information, the INS is not comprehensive - additional information will be added in an iterative fashion. For detailed documentation about the information within INS, please see our open-source INS Data Gathering GitHub repository."
    - paragraph: "We look forward to hearing your feedback at nciofficeofdatasharing@mail.nih.gov."
    - paragraph: "Programs: NCI Programs are curated for use within INS by the NCI’s Office of Data Sharing and represent collections of scientific research projects and support that serve as hubs for scientific discovery. Programs are associated with Special Topic groupings (such as Pediatric or Cancer MoonshotSM) as well as known sources of NCI funding (such as specific awards or Notices of Funding Opportunities). Programs may support multiple projects and their downstream efforts. Not all NCI-supported programs are included in the current release of INS. Curation is ongoing; additional programs will be added, and existing program information will be updated in the future."
    - paragraph: "Grants & Projects: NCI-supported projects represent a focused scientific study or effort. Projects are groupings of grants, which represent yearly support and supplements. The INS primarily consists of extramural projects, but also includes some intramural projects and a small number of projects supported by contracts. Only grants and projects that received NCI funding during or after year 2000 are included in the INS. The curation of grants and projects is automated using resources from the NIH RePORTER."
    - paragraph: "Publications: The INS includes publications associated with NCI-supported projects. Only publications published during or after year 2000 and available on NCBI PubMed are included within the INS, and many publications are associated with more than one project. The curation of publications and their association with projects is automated using resources from the NIH RePORTER, NCBI PubMed, and NIH iCite. For more information about how publications are associated with projects, please see the NIH RePORTER FAQ."
    - paragraph: "Datasets & Cohorts: The INS incorporates information and links to datasets and cohort studies generated from NCI-supported research. Dataset information is retrieved from public sources using a combination of automated techniques and curation before it is reviewed and included within the INS. Initially, this includes references to NCI-supported study information from the following data sources, though the INS will continue to expand to other data resources in the future."
    - paragraph: "CEDCD: NCI Cancer Epidemiology Descriptive Cohort Database"
    - paragraph: "CTD² Network: NCI Cancer Target Discovery and Development Network"
    - paragraph: "dbGaP: NCBI Database of Genotypes and Phenotypes"
    - paragraph: "DCEG: NCI Division of Cancer Epidemiology & Genetics"
    - paragraph: "DCTD: NCI Division of Cancer Treatment & Diagnosis"
    - paragraph: "GDC: NCI Genomic Data Commons"
    - paragraph: "GEO: NCBI Gene Expression Omnibus"
    - paragraph: "NCCR Data Platform: NCI CCDI National Childhood Cancer Registry Data Platform"
    - paragraph: "SRA: NCBI Sequence Read Archive"
    - paragraph: "Tools & Resources: The INS is compiling an index of known tools, resources, and data repositories that support the NCI’s mission to support the cancer research community. Most resources listed within the INS were previously included in the retired Resources for Researchers (R4R) catalog, though more are curated and included as they are found. This page includes a wide variety of resources grouped into several categories listed below."
    - paragraph: "Analytic Tool"
    - paragraph: "Data Repository"
    - paragraph: "Catalog"
    - paragraph: "Knowledgebase"
    - paragraph: "Biorepository"
    - paragraph: "Registry"
    - paragraph: "Guidance and Documentation"
    - paragraph: "SITE FUNCTIONALITY"
    - paragraph: "Home"
    - paragraph: "Provides an overview of the site, links to selected site pages, and a snapshot of the number of programs, resources, datasets, projects, grants, and publications."
    - paragraph: "Programs"
    - paragraph: "Provides access to all Program-derived information within the INS. Tabs for Programs, Projects, Grants, and Publications each show summary information and provide links to other resources where appropriate. Filters applied on the left will change the information displayed in all tabs and plots accordingly. Select a Program or Project link in the table to view additional information."
    - paragraph: "Datasets & Cohorts"
    - paragraph: "Provides access to all information on Datasets and Cohorts captured within the INS. The list of displayed Datasets can be narrowed using the keyword search box or the left-hand filters. Select a Dataset title to see additional information."
    - paragraph: "Tools & Resources"
    - paragraph: "Provides access to all information on Resources captured within the INS. The list of displayed Resources can be narrowed using the keyword search box or the left-hand filters. Select a Resource title to see additional information."
    - paragraph: "About"
    - paragraph: "Describes the objectives and scope of the INS, its data gathering process, and the site’s functionality."
    - paragraph: "CONTACT INS"
    - paragraph: "Thank you for visiting! For questions or feedback, please contact nciofficeofdatasharing@mail.nih.gov."
